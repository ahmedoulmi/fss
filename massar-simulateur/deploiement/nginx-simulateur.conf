# Façade publique du simulateur.
# Copier dans /etc/nginx/sites-available/massar-simulateur, puis lier dans
# sites-enabled. certbot ajoutera lui-même le bloc TLS et la redirection.
#
# Remplacer simulateur.massar.dz par le domaine retenu.

# Freine une tentative de devinette de jetons. Un jeton fait 128 bits : la
# deviner est hors de portée, mais rien n'oblige à laisser marteler la porte.
limit_req_zone $binary_remote_addr zone=massar_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name simulateur.massar.dz;

    # La page ne charge rien d'extérieur : ni police, ni script, ni image
    # distante. On l'inscrit dans la politique plutôt que de s'y fier.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Un lien de simulation ne doit pas se retrouver dans un index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=massar_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
