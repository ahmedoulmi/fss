# Déploiement du simulateur sur Cloudflare Workers.
#
#   bash deployer.sh /chemin/vers/bareme-secret.json
#
# Le script enchaîne tout : contrôle avant mise en service, création de la
# base, report de son identifiant ici, dépôt du barème en secret, publication.

name = "massar-simulateur"
main = "serveur/adaptateurs/cloudflare/worker.js"
compatibility_date = "2026-09-01"

# Publie sur <nom>.<compte>.workers.dev. À passer à false le jour où un
# domaine Massar prendra le relais.
workers_dev = true

# La page et ses fichiers. Aucun taux ne s'y trouve : le contrôle
# `npm run verifier` s'en assure avant chaque mise en ligne.
[assets]
directory = "src"
binding = "ASSETS"

[[d1_databases]]
binding = "JETONS"
database_name = "massar-jetons"
# Remplacer par l'identifiant rendu par : npx wrangler d1 create massar-jetons
database_id = "00000000-0000-0000-0000-000000000000"
