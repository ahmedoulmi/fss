# Publie le dossier gmedic/ sur GitHub Pages.
# Le site est statique : rien à construire, on téléverse le dossier tel quel.
name: Déployer le site Gmedic

on:
  push:
    branches: [main]
    paths:
      - 'gmedic/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gmedic

      - id: deployment
        uses: actions/deploy-pages@v4
